# Base44 sandbox environment for PlayTube.
# The app is served from the bind-mounted checkout by Apache + mod_php, so edits to
# PHP/CSS/JS files are picked up on the next request (no build step).
services:
  db:
    image: mysql:5.7
    restart: on-failure
    command:
      - --sql-mode=NO_ENGINE_SUBSTITUTION
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: base44root
      MYSQL_DATABASE: playtube
      MYSQL_USER: playtube
      MYSQL_PASSWORD: base44playtube
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pbase44root --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # One-shot: imports playtube.sql and seeds the admin account. The bundled
  # /install wizard is bypassed because it requires an Envato purchase-code check.
  db-setup:
    image: mysql:5.7
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: base44root
      DB_NAME: playtube
    volumes:
      - ./playtube.sql:/seed/playtube.sql:ro
      - ./docker/base44/db-setup.sql:/seed/db-setup.sql:ro
      - ./docker/base44/db-setup.sh:/seed/db-setup.sh:ro
    entrypoint: ["sh", "/seed/db-setup.sh"]

  web:
    build:
      context: .
      dockerfile: docker/base44/Dockerfile
    restart: on-failure
    labels:
      base44.project: PlayTube
      base44.kind: web
      base44.port: "3000"
    ports:
      - "3000:80"
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
    environment:
      - DB_HOST=db
      - DB_USER=playtube
      - DB_PASSWORD=base44playtube
      - DB_NAME=playtube
      - SITE_URL=${SITE_URL:-}
      - PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX:-}
      - BASE44_PREVIEW_MODE
    # Platform-managed secrets (MUX_TOKEN_ID, MUX_TOKEN_SECRET). Last, so dashboard
    # values always win over anything else.
    env_file:
      - /run/base44/app.env
    volumes:
      - .:/var/www/html
      - ./php.ini:/usr/local/etc/php/php.ini:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/index.php?link1=home | grep -qi '</html>' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  db_data:
